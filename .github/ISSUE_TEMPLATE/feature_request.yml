name: Feature request
description: Suggest something MetaStrip Video should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        MetaStrip Video is deliberately small — one window, one button. Ideas that keep
        it that way have the best chance.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that MetaStrip makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
      description: Other tools or workarounds, and why they did not fit.
    validations:
      required: false
