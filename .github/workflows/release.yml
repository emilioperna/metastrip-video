name: release

# Cutting a release is pushing a tag. Everything below is what turns that tag
# into a signed installer plus the latest.json the app polls.
on:
  push:
    tags:
      - "v*"

# Windows x86_64 only: the app is Windows-only and the bundled FFmpeg sidecar is
# a Windows binary. Adding another target means adding a sidecar for it first.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Every action in this job is pinned to a commit, not a tag or a branch:
      # this is the job the updater signing key is available to, and a moved tag
      # would change what runs beside it. The comment records the version each
      # SHA was, so bumping one stays a readable change.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The tag is the single source of truth for the release; refuse to build
      # if the three version files disagree with it, rather than shipping an
      # installer whose version the updater will compare wrongly.
      - name: Check version matches the tag
        run: node scripts/check-version.mjs ${{ github.ref_name }}

      # The sidecars are not in git. This fetches the pinned build and verifies
      # the SHA-256 of each executable before Tauri looks for them.
      - name: Fetch the bundled FFmpeg
        run: npm run setup:ffmpeg

      - name: Verify the sidecars are in place
        shell: pwsh
        run: |
          foreach ($name in "ffmpeg", "ffprobe") {
            $sidecar = "src-tauri/binaries/$name-x86_64-pc-windows-msvc.exe"
            if (-not (Test-Path $sidecar)) { throw "missing sidecar: $sidecar" }
            "$sidecar $((Get-Item $sidecar).Length) bytes"
          }

      - run: npm run build

      - run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Builds, signs the updater artifacts, creates the release and uploads the
      # installer, the .sig and latest.json. Left as a draft so a human presses
      # publish.
      # tauri-action v1.0.0 — pinned because this step receives the updater signing key
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MetaStrip Video v__VERSION__
          releaseBody: Signed Windows installer. Existing installs update themselves.
          releaseDraft: true
          prerelease: false
          # latest.json is generated and uploaded by the action itself; the app
          # reads it from the release's /latest/download/ URL.
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc
