[package]
name = "aurevm-video-cleaner"
version = "0.2.0"
description = "Aurevm Video Cleaner"
authors = ["Aurevm"]
edition = "2021"

[lib]
name = "aurevm_video_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
